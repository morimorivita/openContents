<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>もりもり元素一覧表</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;600;700&display=swap"
        rel="stylesheet">
    <!-- DataTables CSS -->
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">

    <style>
        :root {
            --green-900: #14532d;
            --green-800: #166534;
            --green-700: #15803d;
            --emerald-600: #059669;
            --emerald-500: #10b981;
            --emerald-400: #34d399;
            --mint-100: #dcfce7;
            --mint-50: #f2fbf6;
            --bg-gradient: linear-gradient(135deg, #f4fbf7 0%, #ebf9f1 50%, #e4f5ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.86);
            --glass-border: rgba(16, 185, 129, 0.24);
            --text-main: #0f2e1f;
            --text-body: #1e293b;
            --text-muted: #475569;
            --text-subtle: #64748b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', 'Inter', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Yu Gothic UI', 'Meiryo', sans-serif;
            background-color: #eef9f2;
            background-image:
                radial-gradient(circle at 8% 12%, rgba(16, 185, 129, 0.16) 0%, transparent 42%),
                radial-gradient(circle at 92% 88%, rgba(52, 211, 153, 0.18) 0%, transparent 44%),
                radial-gradient(circle at 50% 0%, rgba(167, 243, 208, 0.25) 0%, transparent 50%),
                var(--bg-gradient);
            background-attachment: fixed;
            margin: 0;
            padding: 10px 14px 20px;
            color: var(--text-main);
            min-height: 100vh;
        }

        /* Compact Top Bar (Glowing Title + Control Buttons) */
        .top-bar {
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px 14px;
            max-width: 1520px;
        }

        @keyframes titleShimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 220% 50%; }
        }

        @keyframes titleGlowPulse {
            0%, 100% {
                filter: drop-shadow(0 0 6px rgba(16, 185, 129, 0.36)) drop-shadow(0 0 14px rgba(52, 211, 153, 0.24));
            }
            50% {
                filter: drop-shadow(0 0 10px rgba(16, 185, 129, 0.68)) drop-shadow(0 0 22px rgba(6, 182, 212, 0.48));
            }
        }

        h1 {
            font-size: clamp(1.1rem, 2vw, 1.32rem);
            font-weight: 700;
            margin: 0;
            padding: 2px 4px;
            line-height: 1.2;
            white-space: nowrap;
            letter-spacing: 0.03em;
            background: linear-gradient(
                110deg,
                #14532d 0%,
                #15803d 25%,
                #10b981 42%,
                #a7f3d0 50%,
                #06b6d4 58%,
                #15803d 75%,
                #14532d 100%
            );
            background-size: 220% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleShimmer 4.2s linear infinite, titleGlowPulse 2.8s ease-in-out infinite;
        }

        /* Filter & Control Bar */
        .filter-buttons {
            margin: 0;
            display: flex;
            gap: 8px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 7px 16px;
            border: 1px solid rgba(16, 185, 129, 0.32);
            border-radius: 30px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.88);
            color: var(--green-900);
            transition: all 0.25s ease;
            font-weight: 600;
            font-size: 0.84rem;
            font-family: inherit;
            backdrop-filter: blur(6px);
            box-shadow: 0 2px 8px rgba(20, 83, 45, 0.06);
        }

        .filter-btn:hover {
            background: #ffffff;
            border-color: var(--emerald-500);
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.18);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #15803d 0%, #10b981 100%);
            border-color: #059669;
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }

        .filter-btn-gemini {
            border-color: rgba(16, 185, 129, 0.55);
            color: #047857;
            background: linear-gradient(135deg, rgba(236, 253, 245, 0.95), rgba(209, 250, 229, 0.9));
        }

        .filter-btn-gemini.active {
            background: linear-gradient(135deg, #059669 0%, #10b981 55%, #06b6d4 100%);
            border-color: #059669;
            color: #ffffff;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.42);
        }

        .filter-btn-colvis {
            border-color: rgba(21, 128, 61, 0.4);
            color: var(--green-800);
            background: rgba(255, 255, 255, 0.92);
        }

        /* Glassmorphism Container */
        .table-container {
            position: relative;
            width: 100%;
            max-width: 1520px;
            margin: 0 auto;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px 14px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 18px 45px rgba(20, 83, 45, 0.09);
        }

        /* DataTable Styling Overrides (Respect scrollX dynamic calculation) */
        table.dataTable {
            border-collapse: separate !important;
            border-spacing: 0 5px !important;
            width: max-content !important;
            min-width: 100%;
            margin: 0 !important;
            background: transparent !important;
        }

        table.dataTable thead th {
            background: linear-gradient(180deg, #166534 0%, #14532d 100%) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.16) !important;
            padding: 11px 10px !important;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-bottom: 2px solid var(--emerald-500) !important;
            white-space: nowrap;
        }

        .dataTables_scrollHead {
            background: #14532d !important;
            border-radius: 10px 10px 0 0;
            overflow: hidden !important;
        }

        .dataTables_scrollBody {
            -webkit-overflow-scrolling: touch;
        }

        .dataTables_scroll {
            width: 100%;
        }

        table.dataTable tbody tr {
            background-color: #ffffff !important;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            cursor: pointer;
        }

        table.dataTable tbody tr:nth-child(even) {
            background-color: var(--mint-50) !important;
        }

        table.dataTable tbody tr:hover {
            background-color: #e3f8ec !important;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.16);
        }

        table.dataTable tbody td {
            border-top: 1px solid rgba(16, 185, 129, 0.14) !important;
            border-bottom: 1px solid rgba(16, 185, 129, 0.14) !important;
            border-left: 1px solid rgba(16, 185, 129, 0.08) !important;
            border-right: 1px solid rgba(16, 185, 129, 0.08) !important;
            padding: 9px 10px !important;
            vertical-align: middle;
            color: var(--text-body);
            font-size: 0.86rem;
            line-height: 1.5;
        }

        table.dataTable tbody tr td:first-child {
            border-left: 1px solid rgba(16, 185, 129, 0.18) !important;
            border-radius: 10px 0 0 10px;
        }

        table.dataTable tbody tr td:last-child {
            border-right: 1px solid rgba(16, 185, 129, 0.18) !important;
            border-radius: 0 10px 10px 0;
        }

        .col-wrap {
            white-space: normal !important;
            word-break: break-word;
            min-width: 260px;
        }

        .col-nowrap {
            white-space: nowrap;
        }

        .clickable-no {
            text-align: center;
            color: var(--green-700) !important;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        table.dataTable tbody tr:hover .clickable-no {
            color: var(--emerald-600) !important;
        }

        .element-name-ja {
            font-weight: 700;
            color: var(--green-900);
            font-size: 0.92rem;
        }

        /* Symbol Badges */
        .symbol-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            padding: 4px 11px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
            background: linear-gradient(135deg, #ecfdf5 0%, #d1fae5 100%);
            color: #14532d;
            border: 1px solid #86efac;
            box-shadow: 0 2px 6px rgba(16, 185, 129, 0.14);
        }

        /* Gemini Highlight Rows & Badges (1: H, 6: C, 18: Ar) */
        @keyframes geminiRowPulse {
            0%, 100% {
                box-shadow: 0 0 0 1px rgba(16, 185, 129, 0.35), 0 0 14px rgba(16, 185, 129, 0.24);
            }
            50% {
                box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.48), 0 0 24px rgba(16, 185, 129, 0.45);
            }
        }

        @keyframes geminiBadgeGlow {
            0%, 100% {
                box-shadow: 0 0 8px rgba(16, 185, 129, 0.45), 0 2px 8px rgba(6, 182, 212, 0.28);
            }
            50% {
                box-shadow: 0 0 18px rgba(16, 185, 129, 0.78), 0 0 26px rgba(52, 211, 153, 0.55);
            }
        }

        table.dataTable tbody tr.gemini-highlight {
            background: linear-gradient(90deg, #dcfce7 0%, #d1fae5 45%, #cffafe 100%) !important;
            animation: geminiRowPulse 2.8s ease-in-out infinite;
        }

        table.dataTable tbody tr.gemini-highlight:hover {
            background: linear-gradient(90deg, #bbf7d0 0%, #a7f3d0 50%, #a5f3fc 100%) !important;
            transform: translateY(-1px);
        }

        table.dataTable tbody tr.gemini-highlight td {
            border-top: 1px solid rgba(16, 185, 129, 0.45) !important;
            border-bottom: 1px solid rgba(16, 185, 129, 0.45) !important;
            color: #064e3b;
        }

        table.dataTable tbody tr.gemini-highlight td:first-child {
            border-left: 5px solid #10b981 !important;
            box-shadow: inset 4px 0 10px rgba(16, 185, 129, 0.25);
        }

        table.dataTable tbody tr.gemini-highlight td:last-child {
            border-right: 1px solid rgba(16, 185, 129, 0.45) !important;
        }

        .symbol-badge.gemini-badge {
            background: linear-gradient(135deg, #10b981 0%, #059669 55%, #06b6d4 100%);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.75);
            animation: geminiBadgeGlow 2.4s ease-in-out infinite;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .symbol-badge.gemini-badge::after {
            content: " ✦";
            font-size: 0.75rem;
            color: #fef08a;
            margin-left: 3px;
            text-shadow: 0 0 6px rgba(254, 240, 138, 0.9);
        }

        /* DataTables Controls (Light Green Theme) */
        .dataTables_wrapper .dataTables_filter {
            margin-bottom: 10px;
        }

        .dataTables_wrapper .dataTables_filter input {
            background: #ffffff !important;
            border: 1px solid rgba(16, 185, 129, 0.35) !important;
            border-radius: 30px !important;
            color: var(--text-main) !important;
            padding: 6px 14px !important;
            font-size: 0.85rem !important;
            outline: none !important;
            transition: all 0.25s;
            margin-left: 6px;
        }

        .dataTables_wrapper .dataTables_filter input:focus {
            border-color: var(--emerald-500) !important;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.18) !important;
        }

        .dataTables_wrapper .dataTables_filter label,
        .dataTables_wrapper .dataTables_length label {
            color: var(--text-muted) !important;
            font-size: 0.84rem !important;
            font-weight: 500;
        }

        .dataTables_wrapper .dataTables_length {
            margin-bottom: 10px;
        }

        .dataTables_wrapper .dataTables_length select {
            background: #ffffff !important;
            border: 1px solid rgba(16, 185, 129, 0.35) !important;
            border-radius: 8px !important;
            color: var(--text-main) !important;
            padding: 4px 8px !important;
            font-size: 0.84rem !important;
            outline: none;
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_paginate {
            color: var(--text-muted) !important;
            font-size: 0.82rem !important;
            margin-top: 10px;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button {
            color: var(--green-800) !important;
            border-radius: 6px !important;
            padding: 4px 10px !important;
            font-size: 0.82rem !important;
            border: 1px solid transparent !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button:hover:not(.disabled) {
            background: #dcfce7 !important;
            color: var(--green-900) !important;
            border-color: #86efac !important;
        }

        .dataTables_wrapper .dataTables_paginate .paginate_button.current,
        .dataTables_wrapper .dataTables_paginate .paginate_button.current:hover {
            background: linear-gradient(135deg, #15803d 0%, #10b981 100%) !important;
            border: none !important;
            color: #ffffff !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 9px;
            height: 9px;
        }

        ::-webkit-scrollbar-track {
            background: #e8f7ef;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(16, 185, 129, 0.4);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(5, 150, 105, 0.65);
        }

        /* Modal Base Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 46, 31, 0.42);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            padding: 12px;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 22px;
            width: 100%;
            max-width: 460px;
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 55px rgba(20, 83, 45, 0.22);
            transform: translateY(-16px);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            margin-bottom: 14px;
            border-bottom: 1px solid rgba(16, 185, 129, 0.18);
            padding-bottom: 10px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--green-900);
            text-align: center;
        }

        .modal-body {
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 16px;
            padding-right: 4px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 10px;
            transition: background 0.2s;
            border: 1px solid transparent;
        }

        .checkbox-item:hover {
            background: #f0fdf4;
            border-color: rgba(16, 185, 129, 0.25);
        }

        .checkbox-item input[type="checkbox"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--emerald-600);
        }

        .checkbox-item span {
            cursor: pointer;
            font-size: 0.95rem;
            color: var(--text-main);
            user-select: none;
            flex-grow: 1;
            font-weight: 500;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            border-top: 1px solid rgba(16, 185, 129, 0.18);
            padding-top: 14px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s ease;
            font-size: 0.88rem;
        }

        .btn-cancel {
            background: #ffffff;
            color: var(--text-muted);
            border: 1px solid rgba(100, 116, 139, 0.35);
        }

        .btn-cancel:hover {
            background: #f1f5f9;
            color: var(--text-main);
        }

        .btn-apply {
            background: linear-gradient(135deg, #15803d 0%, #10b981 100%);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.32);
        }

        .btn-apply:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.45);
        }

        /* Detail Card Modal */
        @keyframes geminiCardPulse {
            0%, 100% {
                box-shadow: 0 24px 60px rgba(6, 95, 70, 0.24), 0 0 22px rgba(16, 185, 129, 0.42);
                border-color: #10b981;
            }
            50% {
                box-shadow: 0 24px 60px rgba(6, 95, 70, 0.28), 0 0 38px rgba(6, 182, 212, 0.62);
                border-color: #06b6d4;
            }
        }

        .card-modal-content {
            background: linear-gradient(155deg, #ffffff 0%, #f3fbf7 100%);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 18px;
            padding: 22px;
            width: 100%;
            max-width: 660px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 24px 60px rgba(20, 83, 45, 0.22);
            transform: scale(0.95);
            transition: transform 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .card-modal-content {
            transform: scale(1);
        }

        .card-modal-content.gemini-card {
            background: linear-gradient(155deg, #ffffff 0%, #ecfdf5 55%, #ecfeff 100%);
            border: 2px solid #10b981;
            animation: geminiCardPulse 2.6s ease-in-out infinite;
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid rgba(16, 185, 129, 0.2);
            padding-bottom: 14px;
            margin-bottom: 16px;
        }

        .card-title-group {
            flex-grow: 1;
            padding-right: 12px;
        }

        .card-title-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .card-title {
            margin: 0;
            font-size: 1.4rem;
            color: var(--green-900);
            font-weight: 700;
            line-height: 1.3;
        }

        .card-sub-titles {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin: 0;
        }

        .close-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-subtle);
            font-size: 1.6rem;
            line-height: 1;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .close-icon-btn:hover {
            color: var(--green-900);
            background: rgba(16, 185, 129, 0.14);
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 11px 14px;
            margin-bottom: 8px;
        }

        .card-item {
            background: rgba(255, 255, 255, 0.88);
            border: 1px solid rgba(16, 185, 129, 0.18);
            border-radius: 11px;
            padding: 10px 12px;
        }

        .card-modal-content.gemini-card .card-item {
            background: rgba(255, 255, 255, 0.92);
            border-color: rgba(16, 185, 129, 0.35);
        }

        .card-item-full {
            grid-column: 1 / -1;
        }

        .card-item-label {
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            color: var(--emerald-600);
            margin-bottom: 4px;
            font-weight: 700;
        }

        .card-item-value {
            font-size: 0.93rem;
            color: var(--text-main);
            word-break: break-word;
            line-height: 1.5;
        }

        .card-nav-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            border-top: 1px solid rgba(16, 185, 129, 0.2);
            padding-top: 14px;
            margin-top: auto;
        }

        .card-nav-center {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav {
            background: #ecfdf5;
            border: 1px solid rgba(16, 185, 129, 0.45);
            color: var(--green-800);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.84rem;
            font-family: inherit;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-nav:hover:not(:disabled) {
            background: var(--emerald-500);
            border-color: var(--emerald-600);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transform: translateY(-1px);
        }

        .btn-nav:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .card-counter {
            font-size: 0.84rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Loading Overlay Styles (Light Green Theme) */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(240, 253, 244, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.45s ease, visibility 0.45s ease;
            padding: 16px;
        }

        .loading-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loading-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 20px;
            padding: 34px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(20, 83, 45, 0.14);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .spinner-container {
            position: relative;
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
        }

        .green-spinner {
            width: 100%;
            height: 100%;
            border: 4px solid rgba(16, 185, 129, 0.18);
            border-top: 4px solid #15803d;
            border-right: 4px solid #10b981;
            border-radius: 50%;
            animation: greenSpin 0.95s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .spinner-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, transparent 70%);
            border-radius: 50%;
            animation: greenPulse 1.4s ease-in-out infinite alternate;
        }

        @keyframes greenSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes greenPulse {
            0% { opacity: 0.35; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.25); }
        }

        .loading-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--green-900);
            margin-bottom: 6px;
        }

        .loading-subtitle {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        .loading-bar {
            width: 100%;
            height: 6px;
            background: #dcfce7;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loading-bar-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #15803d, #10b981, #34d399);
            border-radius: 10px;
            animation: loadingMove 1.4s ease-in-out infinite;
        }

        @keyframes loadingMove {
            0% { left: -40%; width: 40%; }
            50% { width: 60%; }
            100% { left: 100%; width: 40%; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 640px) {
            body {
                padding: 12px 8px 20px;
            }

            .table-container {
                padding: 12px 8px;
                border-radius: 12px;

            }

        }

        @media (max-width: 550px) {

            }

    <script>
        $(document).ready(function () {
            const GEMINI_NUMBERS = new Set([1, 6, 18]);

            function hideLoading() {
                const overlay = document.getElementById('loadingOverlay');
                if (overlay && !overlay.classList.contains('fade-out')) {
                    overlay.classList.add('fade-out');
                    setTimeout(function () {
                        overlay.style.display = 'none';
                    }, 460);
                }
            }

            function escapeHtml(value) {
                if (value === null || value === undefined) return '';
                return String(value)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#39;');
            }

            function isGeminiElement(row) {
                return GEMINI_NUMBERS.has(Number(row.number));
            }

            function populateTable(data) {
                const tbody = document.getElementById('elementsBody');
                tbody.innerHTML = '';

                data.forEach(function (row) {
                    const tr = document.createElement('tr');
                    tr._rowData = row;

                    const gemini = isGeminiElement(row);
                    if (gemini) {
                        tr.classList.add('gemini-highlight');
                    }

                    const badgeClass = gemini ? 'symbol-badge gemini-badge' : 'symbol-badge';

                    tr.innerHTML =
                        '<td class="clickable-no col-nowrap" title="クリックして詳細カードを表示">' + escapeHtml(row.number) + '</td>' +
                        '<td class="col-nowrap" style="text-align:center;"><span class="' + badgeClass + '">' + escapeHtml(row.symbol) + '</span></td>' +
                        '<td class="element-name-ja col-nowrap">' + escapeHtml(row.name_ja) + '</td>' +
                        '<td class="col-nowrap">' + escapeHtml(row.reading_ja) + '</td>' +
                        '<td class="col-nowrap">' + escapeHtml(row.name_en) + '</td>' +
                        '<td class="col-wrap">' + escapeHtml(row.origin) + '</td>' +
                        '<td class="col-wrap">' + escapeHtml(row.features) + '</td>';

                    tbody.appendChild(tr);
                });
            }

            let elementsData = [];
            try {
                const rawJson = document.getElementById('elementsData').textContent;
                elementsData = JSON.parse(rawJson);
                populateTable(elementsData);
            } catch (err) {
                console.error('Failed to parse embedded elements data:', err);
                const titleEl = document.querySelector('.loading-title');
                const subEl = document.querySelector('.loading-subtitle');
                if (titleEl && subEl) {
                    titleEl.textContent = 'データの読み込みに失敗しました';
                    titleEl.style.color = '#dc2626';
                    subEl.textContent = '埋め込みデータの形式を確認してください。';
                }
                return;
            }

            const table = $('#elementsTable').DataTable({
                language: {
                    url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/ja.json'
                },
                lengthMenu: [[25, 50, 100, -1], [25, 50, 100, '全件']],
                pageLength: -1,
                scrollX: true,
                scrollY: '78vh',
                scrollCollapse: true,
                autoWidth: false,
                order: [[0, 'asc']],
                columnDefs: [
                    { targets: [0], width: '78px', type: 'num' },
                    { targets: [1], width: '92px' },
                    { targets: [2], width: '140px' },
                    { targets: [3], width: '190px' },
                    { targets: [4], width: '150px' },
                    { targets: [5], width: '320px' },
                    { targets: [6], width: '320px' }
                ],
                initComplete: function () {
                    hideLoading();
                }
            });

            // Failsafe in case external language JSON stalls or is blocked on file:///
            setTimeout(hideLoading, 1800);

            // Quick Filter Buttons
            $('.filter-btn:not(#btnShowColVis)').on('click', function () {
                $('.filter-btn:not(#btnShowColVis)').removeClass('active');
                $(this).addClass('active');

                const filterType = $(this).attr('data-filter');
                if (filterType === 'gemini') {
                    table.column(0).search('^(1|6|18)$', true, false).draw();
                } else {
                    table.column(0).search('').draw();
                }
            });

            // Column Visibility Modal Logic
            const colVisModal = document.getElementById('colVisModal');
            const colVisList = document.getElementById('colVisList');
            const btnShowColVis = document.getElementById('btnShowColVis');
            const btnCancelColVis = document.getElementById('btnCancelColVis');
            const btnApplyColVis = document.getElementById('btnApplyColVis');

            function closeColVisModal() {
                colVisModal.classList.remove('active');
            }

            btnShowColVis.addEventListener('click', function () {
                colVisList.innerHTML = '';

                table.columns().every(function () {
                    const col = this;
                    const idx = col.index();
                    const title = $(col.header()).text().trim();
                    const isVisible = col.visible();

                    const label = document.createElement('label');
                    label.className = 'checkbox-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.value = String(idx);
                    checkbox.checked = isVisible;

                    const span = document.createElement('span');
                    span.textContent = title;

                    label.appendChild(checkbox);
                    label.appendChild(span);
                    colVisList.appendChild(label);
                });

                colVisModal.classList.add('active');
            });

            btnCancelColVis.addEventListener('click', closeColVisModal);
            colVisModal.addEventListener('click', function (e) {
                if (e.target === colVisModal) closeColVisModal();
            });

            btnApplyColVis.addEventListener('click', function () {
                const checkboxes = colVisList.querySelectorAll('input[type="checkbox"]');
                checkboxes.forEach(function (cb) {
                    const idx = parseInt(cb.value, 10);
                    table.column(idx).visible(cb.checked, false);
                });

                table.columns.adjust().draw(false);
                closeColVisModal();
            });

            // Detail Card Modal Logic
            const detailModal = document.getElementById('detailCardModal');
            const detailCardContent = document.getElementById('detailCardContent');
            let currentCardFilteredIndex = -1;

            function getFilteredRowNodes() {
                return table.rows({ search: 'applied', order: 'applied' }).nodes().toArray();
            }

            function showCardAtIndex(idx) {
                const visibleNodes = getFilteredRowNodes();
                if (visibleNodes.length === 0) return;

                if (idx < 0) idx = visibleNodes.length - 1;
                if (idx >= visibleNodes.length) idx = 0;

                currentCardFilteredIndex = idx;
                const rowNode = visibleNodes[idx];
                const rowData = rowNode && rowNode._rowData ? rowNode._rowData : null;
                if (!rowData) return;

                const gemini = isGeminiElement(rowData);
                detailCardContent.classList.toggle('gemini-card', gemini);

                const headerBadge = document.getElementById('cardHeaderBadge');
                headerBadge.textContent = rowData.symbol;
                headerBadge.className = gemini ? 'symbol-badge gemini-badge' : 'symbol-badge';

                $('#cardTitle').text(rowData.name_ja);
                $('#cardSubTitles').text(rowData.reading_ja + ' / ' + rowData.name_en);

                $('#cardNumber').text(String(rowData.number));
                $('#cardSymbol').text(rowData.symbol);
                $('#cardNameJa').text(rowData.name_ja);
                $('#cardReadingJa').text(rowData.reading_ja);
                $('#cardNameEn').text(rowData.name_en);
                $('#cardOrigin').text(rowData.origin);
                $('#cardFeatures').text(rowData.features);

                $('#cardCounter').text((idx + 1) + ' / ' + visibleNodes.length);
                detailModal.classList.add('active');
            }

            function closeDetailModal() {
                detailModal.classList.remove('active');
            }

            $('#elementsTable tbody').on('click', 'tr', function (e) {
                if ($(e.target).closest('a').length > 0) return;
                const visibleNodes = getFilteredRowNodes();
                const idx = visibleNodes.indexOf(this);
                if (idx !== -1) {
                    showCardAtIndex(idx);
                }
            });

            $('#btnPrevCard').on('click', function () {
                showCardAtIndex(currentCardFilteredIndex - 1);
            });

            $('#btnNextCard').on('click', function () {
                showCardAtIndex(currentCardFilteredIndex + 1);
            });

            $('#btnCloseCard, #btnCloseCardX').on('click', closeDetailModal);
            detailModal.addEventListener('click', function (e) {
                if (e.target === detailModal) closeDetailModal();
            });

            $(document).on('keydown', function (e) {
                if (colVisModal.classList.contains('active') && e.key === 'Escape') {
                    closeColVisModal();
                    return;
                }
                if (!detailModal.classList.contains('active')) return;
                if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    showCardAtIndex(currentCardFilteredIndex - 1);
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    showCardAtIndex(currentCardFilteredIndex + 1);
                } else if (e.key === 'Escape') {
                    closeDetailModal();
                }
            });
        });
    </script>
</body>

</html>
